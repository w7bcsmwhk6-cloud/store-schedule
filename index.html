<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>店舗スケジュール</title>
  <!-- version: customer-master-1 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#f3f5f8; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
      --accent:#2563eb; --danger:#dc2626; --shadow:0 8px 28px rgba(15,23,42,.08);
      --today:#dbeafe; --selected:#2563eb;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}
    .wrap{max-width:980px;margin:0 auto;padding:16px 14px 96px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    h1{font-size:24px;margin:0}
    .small{font-size:13px;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px}
    .hidden{display:none!important}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .grow{flex:1}
    input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:11px 12px;background:white;color:var(--text)}
    textarea{min-height:76px;resize:vertical}
    label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
    .field{margin-bottom:11px}
    button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:white;font-weight:700;cursor:pointer}
    button.secondary{background:#eef2ff;color:#1e40af}
    button.ghost{background:#f3f4f6;color:#374151}
    button.danger{background:#fee2e2;color:#991b1b}
    button:disabled{opacity:.55;cursor:not-allowed}
    .login{max-width:430px;margin:8vh auto 0}
    .status{margin-top:10px;font-size:13px;color:var(--muted);white-space:pre-wrap}
    .error{color:#b91c1c}

    .month-card{margin-bottom:12px}
    .month-head{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;margin-bottom:10px}
    .month-title{text-align:center;font-size:20px;font-weight:800}
    .month-nav{min-width:44px;padding:10px 12px}
    .weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr)}
    .weekdays div{text-align:center;font-size:12px;color:var(--muted);padding:6px 0;font-weight:700}
    .day{
      min-height:62px;border:1px solid var(--line);background:#fff;padding:6px 4px;
      display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;
      color:var(--text);font-weight:600;border-radius:0
    }
    .day:nth-child(7n+1){color:#dc2626}
    .day:nth-child(7n){color:#2563eb}
    .day.outside{opacity:.28}
    .day.today{background:var(--today)}
    .day.selected{background:var(--selected);color:#fff}
    .day.selected .count{background:#fff;color:var(--selected)}
    .daynum{font-size:15px;line-height:1}
    .count{
      min-width:22px;height:22px;border-radius:999px;padding:0 6px;
      display:flex;align-items:center;justify-content:center;background:#eef2ff;color:#3730a3;
      font-size:11px;font-weight:800
    }
    .dayoff-list{
      width:100%;display:flex;flex-direction:column;gap:2px;margin-top:1px;
    }
    .dayoff-chip{
      width:100%;padding:2px 3px;border-radius:5px;font-size:9px;line-height:1.15;
      font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      background:#f3f4f6;color:#374151;
    }
    .day.selected .dayoff-chip{background:rgba(255,255,255,.2);color:#fff}


    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
    .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
    .stat b{font-size:20px;display:block}
    .list{display:flex;flex-direction:column;gap:10px}
    .event{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;border-left:6px solid #64748b}
    .event-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .time{font-weight:800;font-size:17px}
    .badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}
    .meta{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}
    .empty{text-align:center;color:var(--muted);padding:34px 12px}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
    .tab{background:#fff;color:#374151;border:1px solid var(--line);padding:11px 8px}
    .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .staff-grid,.loaner-grid{display:grid;gap:10px}
    .staff-card,.loaner-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
    .staff-head,.loaner-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
    .staff-name,.loaner-name{font-weight:800;font-size:16px}
    .mini-list{display:flex;flex-direction:column;gap:7px}
    .mini-event{border-left:4px solid #64748b;padding:8px 9px;background:#f9fafb;border-radius:10px;font-size:13px}
    .mini-time{font-weight:800}
    .available{color:#15803d;font-weight:800}
    .inuse{color:#b91c1c;font-weight:800}

    .timeline-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:#fff}
    .timeline{min-width:1240px}
    .timeline-head,.timeline-row{display:grid;grid-template-columns:110px 1fr}
    .timeline-head{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line)}
    .timeline-staff-head{padding:12px 10px;font-weight:800;border-right:1px solid var(--line)}
    .timeline-scale{position:relative;height:48px}
    .timeline-mark{position:absolute;top:0;height:48px;border-left:1px solid #dbe0e7;font-size:11px;font-weight:700;padding:9px 0 0 4px;white-space:nowrap;color:#374151}
    .timeline-row{min-height:84px;border-bottom:1px solid var(--line)}
    .timeline-row:last-child{border-bottom:0}
    .timeline-staff{padding:12px 10px;border-right:1px solid var(--line);background:#fafafa}
    .timeline-staff b{display:block;font-size:15px}
    .timeline-staff .small{margin-top:4px}
    .timeline-track{position:relative;min-height:84px;background:
      repeating-linear-gradient(to right,#fff 0,#fff calc(6.25% - 1px),#edf0f4 calc(6.25% - 1px),#edf0f4 6.25%)}
    .timeline-event{position:absolute;top:10px;min-height:62px;border:1px solid;border-radius:9px;padding:7px 8px;font-size:11px;line-height:1.35;overflow:hidden;cursor:grab;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
    .timeline-event.dragging{cursor:grabbing;z-index:5;box-shadow:0 7px 20px rgba(17,24,39,.22);opacity:.94}
    .timeline-drag-note{font-size:11px;color:#6b7280;margin:-2px 0 10px}
    .timeline-event b{display:block;font-size:12px;margin-bottom:2px}
    .timeline-event .event-customer{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .timeline-resize{position:absolute;right:0;top:0;width:16px;height:100%;cursor:ew-resize;touch-action:none}
    .timeline-resize::after{content:"";position:absolute;right:4px;top:18%;bottom:18%;width:3px;border-radius:3px;background:currentColor;opacity:.35}
    .timeline-mode{display:flex;gap:6px;margin:0 0 10px}
    .timeline-mode button{padding:8px 13px;font-size:12px;background:#f3f4f6;color:#374151}
    .timeline-mode button.active{background:#2563eb;color:#fff}
    .timeline-track.conflict-target{outline:2px solid #dc2626!important;outline-offset:-2px;background-color:#fef2f2}
    .search-box{margin-bottom:12px}
    .search-results{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .search-item{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
    .search-item b{display:block;margin-bottom:3px}
    .timeline-dayoff{position:absolute;left:1.2%;right:1.2%;top:14px;min-height:54px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:1px solid}
    .timeline-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:12px}
    .fab{position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;font-size:30px;line-height:1;background:var(--accent);box-shadow:0 10px 24px rgba(37,99,235,.35)}
    dialog{border:0;border-radius:20px;padding:0;width:min(94vw,560px);box-shadow:0 24px 70px rgba(0,0,0,.28)}
    dialog::backdrop{background:rgba(15,23,42,.48)}
    .modal{padding:18px}
    .modal h2{margin:0 0 14px;font-size:20px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
    .settings-btn{background:#f3f4f6;color:#374151}
    .settings-section{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
    .settings-section:first-of-type{margin-top:0;padding-top:0;border-top:0}
    .settings-title{font-weight:800;margin-bottom:9px}
    .master-list{display:flex;flex-direction:column;gap:8px}
    .master-row{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center}
    .master-row input{padding:9px 10px}
    .master-row button{padding:9px 10px;font-size:12px}
    .master-row.event-type-row{grid-template-columns:52px 1fr auto auto}
    .master-color{width:46px;height:40px;padding:3px;border-radius:9px}
    .availability{margin-top:5px;font-size:11px;color:#15803d}
    .history-box{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
    .history-item{padding:7px 0;border-bottom:1px solid #f0f1f3;font-size:12px}
    .store-mode .month-card,.store-mode .stats,.store-mode .search-box,.store-mode .tabs,.store-mode #dayView,.store-mode #staffView,.store-mode #loanerView,.store-mode .fab{display:none!important}
    .store-mode #timelineView{display:block!important}
    .store-mode .wrap{max-width:none;padding:8px}
    .store-mode header h1{font-size:18px}
    .date-move{display:flex;gap:6px;margin-top:8px}
    .date-move button{flex:1;padding:8px;font-size:12px}
    .selected-summary{grid-column:1/-1;background:#eff6ff;border-color:#bfdbfe}
    .selected-summary b{font-size:17px}
    .customer-ledger{max-height:60vh;overflow:auto}
    .ledger-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
    .ledger-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .ledger-actions{display:flex;gap:6px}
    .ledger-actions button{padding:7px 9px;font-size:11px}
    .customer-add-box{margin:12px 0;padding:12px;background:#f9fafb;border:1px solid var(--line);border-radius:12px}
    .customer-add-box h3{margin:0 0 10px;font-size:15px}
    .inspection-soon{color:#b45309;font-weight:800}
    .inspection-overdue{color:#b91c1c;font-weight:800}
    .repeat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media print{
      body{background:#fff}
      header,.month-card,.stats,.search-box,.tabs,.fab,.timeline-mode,.timeline-drag-note,#timelineRefreshBtn{display:none!important}
      #timelineView{display:block!important;border:0;box-shadow:none;padding:0}
      .timeline-wrap{overflow:visible;border:0}
      .timeline{min-width:1000px}
      .wrap{max-width:none;padding:0}
    }

    @media(max-width:560px){
      .wrap{padding:12px 10px 94px}
      .stats{grid-template-columns:1fr 1fr}
      .stats .stat:last-child{grid-column:1/-1}
      .grid2{grid-template-columns:1fr}
      .tab{font-size:12px;padding:10px 4px}
      h1{font-size:22px}
      .month-head{grid-template-columns:auto 1fr auto}
      .month-head #todayBtn{grid-column:1/-1}
      .day{min-height:56px;padding:5px 2px}
      .daynum{font-size:14px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <section id="loginView" class="login card">
    <h1>店舗スケジュール</h1>
    <p class="small">スタッフ用ログイン</p>
    <div class="field"><label>メールアドレス</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" style="width:100%">ログイン</button>
    <div id="loginStatus" class="status"></div>
  </section>

  <main id="appView" class="hidden">
    <header>
      <div>
        <h1>店舗スケジュール</h1>
        <div id="userLabel" class="small"></div>
      </div>
      <div class="row">
        <button id="customerLedgerBtn" class="settings-btn">顧客台帳</button>
        <button id="storeModeBtn" class="settings-btn">店頭モード</button>
        <button id="settingsBtn" class="settings-btn">設定</button>
        <button id="logoutBtn" class="ghost">ログアウト</button>
      </div>
    </header>

    <section class="card month-card">
      <div class="month-head">
        <button id="prevMonthBtn" class="ghost month-nav">‹</button>
        <div id="monthTitle" class="month-title"></div>
        <button id="nextMonthBtn" class="ghost month-nav">›</button>
        <button id="todayBtn" class="secondary">今日</button>
      </div>
      <div class="weekdays">
        <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
      </div>
      <div id="calendar" class="calendar"></div>
    </section>

    <section class="stats">
      <div class="stat selected-summary"><span class="small">選択中の日付</span><b id="selectedDateSummary">-</b></div>
      <div class="stat"><span class="small">予定</span><b id="countAll">0</b></div>
      <div class="stat"><span class="small">試乗・商談</span><b id="countSales">0</b></div>
      <div class="stat"><span class="small">代車使用</span><b id="countLoaner">0</b></div>
    </section>

    <section class="card search-box">
      <div class="row">
        <input id="scheduleSearch" class="grow" placeholder="予定検索（お客様名・車種・担当者）">
        <button id="searchClearBtn" type="button" class="ghost">クリア</button>
      </div>
      <div id="searchResults" class="search-results hidden"></div>
    </section>

    <section class="tabs">
      <button type="button" class="tab active" data-view="day">日別</button>
      <button type="button" class="tab" data-view="staff">スタッフ別</button>
      <button type="button" class="tab" data-view="loaner">代車</button>
      <button type="button" class="tab" data-view="timeline">1日表</button>
    </section>

    <section id="dayView" class="card">
      <div class="row" style="margin-bottom:10px">
        <strong class="grow" id="dateTitle">予定</strong>
        <button id="refreshBtn" class="ghost">更新</button>
      </div>
      <div id="scheduleList" class="list"></div>
    </section>

    <section id="staffView" class="card hidden">
      <div class="row" style="margin-bottom:10px">
        <strong class="grow" id="staffDateTitle">スタッフ別</strong>
      </div>
      <div id="staffList" class="staff-grid"></div>
    </section>

    <section id="loanerView" class="card hidden">
      <div class="row" style="margin-bottom:10px">
        <strong class="grow" id="loanerDateTitle">代車状況</strong>
      </div>
      <div id="loanerList" class="loaner-grid"></div>
    </section>

    <section id="timelineView" class="card hidden">
      <div class="row" style="margin-bottom:10px">
        <strong class="grow" id="timelineDateTitle">1日のスケジュール</strong>
        <button id="timelineRefreshBtn" class="ghost">更新</button>
      </div>
      <div class="timeline-mode">
        <button id="timelinePeopleBtn" type="button" class="active">スタッフ</button>
        <button id="timelineLoanerBtn" type="button">代車</button>
        <button id="timelineVehicleBtn" type="button">車両</button>
        <button id="printDayBtn" type="button" class="ghost">印刷/PDF</button>
      </div>
      <div class="small" style="margin-bottom:4px">10:00〜18:00・30分刻み（横にスクロールできます）</div>
      <div class="timeline-drag-note">予定をドラッグして時間・担当を変更。右端をドラッグすると長さを変更できます。</div>
      <div id="timelineTable" class="timeline-wrap"></div>
    </section>

    <button id="addBtn" class="fab" aria-label="予定を追加">＋</button>
  </main>
</div>

<dialog id="customerLedgerDialog">
  <div class="modal">
    <h2>顧客台帳</h2>

    <div class="customer-add-box">
      <h3 id="customerFormTitle">顧客を追加</h3>
      <input type="hidden" id="customerEditId">
      <div class="field"><label>名前</label><input id="ledgerCustomerName" placeholder="必須"></div>
      <div class="field"><label>電話番号</label><input id="ledgerCustomerPhone" type="tel" placeholder="任意"></div>
      <div class="field"><label>次回点検時期</label><input id="ledgerNextInspection" type="date"></div>
      <div class="row">
        <button id="saveCustomerBtn" type="button">顧客を追加</button>
        <button id="cancelCustomerEditBtn" type="button" class="ghost hidden">編集をやめる</button>
      </div>
      <div id="customerFormStatus" class="status"></div>
    </div>

    <input id="ledgerSearch" placeholder="お客様名・電話番号で検索">
    <div id="ledgerList" class="customer-ledger"></div>
    <div class="actions"><button id="closeLedgerBtn" type="button" class="ghost">閉じる</button></div>
  </div>
</dialog>

<dialog id="settingsDialog">
  <div class="modal">
    <h2>設定</h2>
    <div class="small">スタッフと代車の名前・数を変更できます。</div>

    <div class="settings-section">
      <div class="row" style="margin-bottom:9px">
        <div class="settings-title grow">スタッフ</div>
        <button id="addMemberBtn" type="button">＋ 追加</button>
      </div>
      <div id="memberSettingsList" class="master-list"></div>
    </div>

    <div class="settings-section">
      <div class="row" style="margin-bottom:9px">
        <div class="settings-title grow">代車</div>
        <button id="addLoanerBtn" type="button">＋ 追加</button>
      </div>
      <div id="loanerSettingsList" class="master-list"></div>
    </div>

    <div class="settings-section">
      <div class="row" style="margin-bottom:9px">
        <div class="settings-title grow">車両</div>
        <button id="addVehicleBtn" type="button">＋ 追加</button>
      </div>
      <div id="vehicleSettingsList" class="master-list"></div>
    </div>

    <div class="settings-section">
      <div class="row" style="margin-bottom:9px">
        <div class="settings-title grow">予定種類・色</div>
        <button id="addEventTypeBtn" type="button">＋ 追加</button>
      </div>
      <div id="eventTypeSettingsList" class="master-list"></div>
    </div>

    <div id="settingsStatus" class="status"></div>
    <div class="actions">
      <button id="closeSettingsBtn" type="button" class="ghost">閉じる</button>
    </div>
  </div>
</dialog>

<dialog id="scheduleDialog">
  <form id="scheduleForm" class="modal">
    <h2 id="dialogTitle">予定を追加</h2>
    <input type="hidden" id="scheduleId">

    <div class="grid2">
      <div class="field"><label>日付</label><input id="eventDate" type="date" required></div>
      <div class="field"><label>担当者</label><select id="memberId" required></select></div>
    </div>

    <div class="field"><label>予定種類</label><select id="eventTypeId" required></select></div>

    <div id="timeFields" class="grid2">
      <div class="field"><label>開始</label><select id="startTime" required></select></div>
      <div class="field"><label>終了</label><select id="endTime"></select></div>
    </div>

    <div id="availabilityInfo" class="availability"></div>
    <div id="customerField">
      <div class="field">
        <label>顧客台帳から選択</label>
        <select id="customerId"><option value="">顧客を選択しない</option></select>
      </div>
      <div class="grid2">
        <div class="field"><label>お客様名</label><input id="customerName" type="text" placeholder="任意"></div>
        <div class="field"><label>電話番号</label><input id="customerPhone" type="tel" placeholder="任意"></div>
      </div>
      <div id="selectedCustomerInfo" class="small"></div>
    </div>
    <div id="customerHistory" class="history-box hidden"></div>

    <div id="vehicleLoanerFields" class="grid2">
      <div class="field"><label>車種</label><select id="vehicleId"></select></div>
      <div class="field"><label>代車</label><select id="loanerId"></select></div>
    </div>

    <div class="field"><label>メモ</label><textarea id="memo" placeholder="任意"></textarea></div>
    <div id="repeatFields" class="repeat-row">
      <div class="field"><label>繰り返し</label><select id="repeatType">
        <option value="none">なし</option><option value="weekly">毎週</option><option value="monthly">毎月</option>
      </select></div>
      <div class="field"><label>回数</label><select id="repeatCount">
        <option value="2">2回</option><option value="3">3回</option><option value="4">4回</option>
        <option value="6">6回</option><option value="12">12回</option>
      </select></div>
    </div>
    <div id="formStatus" class="status"></div>

    <div id="dateMoveBtns" class="date-move hidden">
      <button type="button" id="prevDayMoveBtn" class="ghost">← 前日へ</button>
      <button type="button" id="nextDayMoveBtn" class="ghost">翌日へ →</button>
    </div>

<script>
const SUPABASE_URL = 'https://zksmpofpyiozjpngleia.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UvrJAAg0jGTsxPTipz4fww_6a_tlERN';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let masters = { members:[], event_types:[], vehicles:[], loaners:[], customers:[] };
let monthSchedules = [];
let timelineMode = 'people';
let selectedDate = localDateISO();
let visibleMonth = new Date(selectedDate + 'T00:00:00');
visibleMonth.setDate(1);

const $ = id => document.getElementById(id);
const loginView=$('loginView'), appView=$('appView'), dialog=$('scheduleDialog'), settingsDialog=$('settingsDialog'), customerLedgerDialog=$('customerLedgerDialog');

function localDateISO(d=new Date()){
  const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return x.toISOString().slice(0,10);
}
function labelOf(row, fall=''){
  if(!row) return fall;
  return row.name ?? row.display_name ?? row.full_name ?? row.label ?? row.title ?? row.model ?? fall;
}
function colorOf(row){ return row?.color ?? row?.hex_color ?? row?.color_code ?? '#64748b'; }
function timeText(v){ return v ? String(v).slice(0,5) : ''; }
function esc(v=''){ return String(v).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function findById(arr,id){ return arr.find(x=>String(x.id)===String(id)); }
function isoFromParts(y,m,d){ return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

function fillTimeSelects(){
  const options=[];
  for(let h=10; h<=18; h++){
    for(const m of [0,30]){
      if(h===18 && m===30) continue;
      const value=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      options.push(`<option value="${value}">${value}</option>`);
    }
  }
  $('startTime').innerHTML='<option value="">開始時間を選択</option>'+options.join('');
  $('endTime').innerHTML='<option value="">終了時間を選択</option>'+options.join('');
}

function isDayOffType(id){
  const et=findById(masters.event_types,id);
  const name=labelOf(et).trim();
  return name==='公休' || name==='有給';
}

function isNormalSchedule(s){
  return !isDayOffType(s.event_type_id);
}

function updateDayOffFields(){
  const dayOff=isDayOffType($('eventTypeId').value);

  $('timeFields').classList.toggle('hidden',dayOff);
  $('customerField').classList.toggle('hidden',dayOff);
  $('vehicleLoanerFields').classList.toggle('hidden',dayOff);

  $('startTime').required=!dayOff;

  if(dayOff){
    $('startTime').dataset.dayoff='1';
    $('endTime').dataset.dayoff='1';
    $('customerName').value='';
    $('vehicleId').value='';
    $('loanerId').value='';
  }
}

async function boot(){
  const { data:{session} } = await sb.auth.getSession();
  if(session) enterApp(session); else showLogin();
}
function showLogin(){ loginView.classList.remove('hidden'); appView.classList.add('hidden'); }
async function enterApp(session){
  loginView.classList.add('hidden'); appView.classList.remove('hidden');
  $('userLabel').textContent = session.user.email || '';
  await loadMasters();
  await loadMonth();
}
async function login(){
  $('loginStatus').textContent='ログイン中…'; $('loginBtn').disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  $('loginBtn').disabled=false;
  if(error){ $('loginStatus').textContent='ログインできません：'+error.message; $('loginStatus').className='status error'; return; }
  $('loginStatus').textContent=''; await enterApp(data.session);
}
async function logout(){ await sb.auth.signOut(); showLogin(); }

async function loadMasters(){
  const names=['members','event_types','vehicles','loaners','customers'];
  for(const name of names){
    const {data,error}=await sb.from(name).select('*').order('id',{ascending:true});
    masters[name]=error?[]:(data||[]);
    if(error) console.error(name,error);
  }
  fillSelect('memberId',masters.members,'担当者を選択');
  fillSelect('eventTypeId',masters.event_types,'種類を選択');
  fillSelect('vehicleId',masters.vehicles,'車種なし');
  fillSelect('loanerId',masters.loaners,'代車なし');
  const customerSel=$('customerId');
  if(customerSel){
    customerSel.innerHTML='<option value="">顧客を選択しない</option>'+
      masters.customers.map(c=>`<option value="${esc(c.id)}">${esc(labelOf(c))}${c.phone?' / '+esc(c.phone):''}</option>`).join('');
  }
  fillTimeSelects();
}
function fillSelect(id,arr,placeholder){
  const el=$(id);
  el.innerHTML=`<option value="">${esc(placeholder)}</option>`+
    arr.map(x=>`<option value="${esc(x.id)}">${esc(labelOf(x,'ID '+x.id))}</option>`).join('');
}

function monthRange(){
  const y=visibleMonth.getFullYear(), m=visibleMonth.getMonth();
  const start=isoFromParts(y,m+1,1);
  const last=new Date(y,m+1,0).getDate();
  const end=isoFromParts(y,m+1,last);
  return {start,end};
}
async function loadMonth(){
  $('scheduleList').innerHTML='<div class="empty">読み込み中…</div>';
  const {start,end}=monthRange();
  const {data,error}=await sb.from('schedules')
    .select('*')
    .gte('event_date',start)
    .lte('event_date',end)
    .order('event_date',{ascending:true})
    .order('start_time',{ascending:true});
  if(error){
    monthSchedules=[];
    $('scheduleList').innerHTML=`<div class="empty error">読み込みエラー<br>${esc(error.message)}</div>`;
  } else {
    monthSchedules=data||[];
  }
  renderCalendar();
  renderSelectedDay();
  renderStaffView();
  renderLoanerView();
  renderTimelineView();
  if($('scheduleSearch')?.value) renderScheduleSearch();
}

function renderCalendar(){
  const y=visibleMonth.getFullYear(), m=visibleMonth.getMonth();
  $('monthTitle').textContent=`${y}年 ${m+1}月`;
  const firstWeekday=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const prevLast=new Date(y,m,0).getDate();
  const today=localDateISO();

  const counts={};
  const dayOffs={};

  monthSchedules.filter(isNormalSchedule).forEach(s=>{
    counts[s.event_date]=(counts[s.event_date]||0)+1;
  });

  monthSchedules.forEach(s=>{
    if(isDayOffType(s.event_type_id)){
      const member=findById(masters.members,s.member_id);
      const et=findById(masters.event_types,s.event_type_id);
      if(!dayOffs[s.event_date]) dayOffs[s.event_date]=[];
      dayOffs[s.event_date].push({
        member:labelOf(member,''),
        type:labelOf(et,'休み'),
        color:colorOf(et)
      });
    }
  });

  let html='';
  for(let i=0;i<42;i++){
    let day, cellMonth=m, cellYear=y, outside=false;
    if(i<firstWeekday){
      day=prevLast-firstWeekday+i+1;
      cellMonth=m-1; outside=true;
    }else if(i>=firstWeekday+daysInMonth){
      day=i-(firstWeekday+daysInMonth)+1;
      cellMonth=m+1; outside=true;
    }else{
      day=i-firstWeekday+1;
    }
    if(cellMonth<0){cellMonth=11;cellYear--}
    if(cellMonth>11){cellMonth=0;cellYear++}
    const iso=isoFromParts(cellYear,cellMonth+1,day);
    const classes=['day'];
    if(outside) classes.push('outside');
    if(iso===today) classes.push('today');
    if(iso===selectedDate) classes.push('selected');
    const count=counts[iso]||0;
    const leaves=dayOffs[iso]||[];
    const leaveHtml=leaves.length
      ? `<span class="dayoff-list">${leaves.map(x=>
          `<span class="dayoff-chip" style="border-left:3px solid ${esc(x.color)}">${esc(x.member)} ${esc(x.type)}</span>`
        ).join('')}</span>`
      : '';

    html+=`<button type="button" class="${classes.join(' ')}" data-date="${iso}">
      <span class="daynum">${day}</span>
      ${count?`<span class="count">${count}</span>`:''}
      ${leaveHtml}
    </button>`;
  }
  $('calendar').innerHTML=html;
  document.querySelectorAll('.day').forEach(btn=>{
    btn.addEventListener('click',()=>{
      selectedDate=btn.dataset.date;
      const d=new Date(selectedDate+'T00:00:00');
      if(d.getMonth()!==visibleMonth.getMonth() || d.getFullYear()!==visibleMonth.getFullYear()){
        visibleMonth=new Date(d.getFullYear(),d.getMonth(),1);
        loadMonth();
      } else {
        renderCalendar();
        renderSelectedDay();
        renderStaffView();
        renderLoanerView();
        renderTimelineView();
      }
    });
  });
}

function selectedSchedules(){
  return monthSchedules.filter(s=>s.event_date===selectedDate);
}
function renderSelectedDay(){
  const schedules=selectedSchedules();
  $('dateTitle').textContent = selectedDate.replaceAll('-','/')+' の予定';
  $('selectedDateSummary').textContent=selectedDate.replaceAll('-','/');

  let sales=0, loan=0;
  for(const s of schedules){
    const et=labelOf(findById(masters.event_types,s.event_type_id));

  }

  if(!schedules.length){
    $('scheduleList').innerHTML='<div class="empty">この日の予定はありません</div>';
    return;
  }

  $('scheduleList').innerHTML=schedules.map(s=>{
    const et=findById(masters.event_types,s.event_type_id);

    const vehicle=findById(masters.vehicles,s.vehicle_id);
    const loaner=findById(masters.loaners,s.loaner_id);
    const dayOff=isDayOffType(s.event_type_id);

    const meta=(dayOff ? [
      labelOf(member) ? '担当：'+labelOf(member) : '',
      s.memo ? 'メモ：'+s.memo : ''
    ] : [
      labelOf(member) ? '担当：'+labelOf(member) : '',
      labelOf(vehicle) ? '車種：'+labelOf(vehicle) : '',
      labelOf(loaner) ? '代車：'+labelOf(loaner) : '',
      s.customer_name ? 'お客様：'+s.customer_name : '',
      s.customer_phone ? '電話：'+s.customer_phone : '',
      s.memo ? 'メモ：'+s.memo : ''
    ]).filter(Boolean).map(esc).join('<br>');

    const timeHtml=dayOff
      ? ''
      : `<div class="time">${esc(timeText(s.start_time))}${s.end_time?' - '+esc(timeText(s.end_time)):''}</div>`;

    return `<article class="event" style="border-left-color:${esc(colorOf(et))}" data-id="${esc(s.id)}">
      <div class="event-top">
        <div>
          ${timeHtml}
          <span class="badge">${esc(labelOf(et,'予定'))}</span>
        </div>
        <button class="ghost editBtn" type="button">編集</button>
      </div>
      <div class="meta">${meta||'詳細なし'}</div>
    </article>`;
  }).join('');

  document.querySelectorAll('.event').forEach(el=>{
    el.querySelector('.editBtn').addEventListener('click',()=>openEdit(el.dataset.id));
  });
}


function renderStaffView(){
  const schedules=selectedSchedules();
  $('staffDateTitle').textContent=selectedDate.replaceAll('-','/')+' スタッフ別';

  if(!masters.members.length){
    $('staffList').innerHTML='<div class="empty">スタッフが登録されていません</div>';
    return;
  }

  $('staffList').innerHTML=masters.members.map(member=>{
    const items=schedules
      .filter(s=>String(s.member_id)===String(member.id))
      .sort((a,b)=>String(a.start_time||'00:00').localeCompare(String(b.start_time||'00:00')));

    const dayOffs=items.filter(s=>isDayOffType(s.event_type_id));
    const normalItems=items.filter(isNormalSchedule);

    const statusHtml=dayOffs.length
      ? dayOffs.map(s=>{
          const et=findById(masters.event_types,s.event_type_id);
          return `<span class="badge" style="background:${esc(colorOf(et))}22;color:${esc(colorOf(et))};margin-left:6px">${esc(labelOf(et,'休み'))}</span>`;
        }).join('')
      : '';

    const bodyParts=[];

    dayOffs.forEach(s=>{
      const et=findById(masters.event_types,s.event_type_id);
      bodyParts.push(`<div class="mini-event" style="border-left-color:${esc(colorOf(et))}">
        <div class="mini-time">${esc(labelOf(et,'休み'))}</div>
        ${s.memo?`<div>${esc(s.memo)}</div>`:''}
      </div>`);
    });

    normalItems.forEach(s=>{
      const et=findById(masters.event_types,s.event_type_id);
      const vehicle=findById(masters.vehicles,s.vehicle_id);
      const loaner=findById(masters.loaners,s.loaner_id);

      const details=[
        labelOf(et,'予定'),
        vehicle ? labelOf(vehicle) : '',
        loaner ? labelOf(loaner) : '',
        s.customer_name || ''
      ].filter(Boolean).map(esc).join(' / ');

      bodyParts.push(`<div class="mini-event" style="border-left-color:${esc(colorOf(et))}">
        <div class="mini-time">${esc(timeText(s.start_time))}${s.end_time?' - '+esc(timeText(s.end_time)):''}</div>
        <div>${details}</div>
      </div>`);
    });

    const body=bodyParts.length ? bodyParts.join('') : '<div class="small">予定なし</div>';

    return `<div class="staff-card">
      <div class="staff-head">
        <div class="staff-name">${esc(labelOf(member,'スタッフ'))}${statusHtml}</div>
        <div class="small">${normalItems.length}件</div>
      </div>
      <div class="mini-list">${body}</div>
    </div>`;
  }).join('');
}

function renderLoanerView(){
  const schedules=selectedSchedules();
  $('loanerDateTitle').textContent=selectedDate.replaceAll('-','/')+' 代車状況';
  if(!masters.loaners.length){
    $('loanerList').innerHTML='<div class="empty">代車が登録されていません</div>';
    return;
  }
  $('loanerList').innerHTML=masters.loaners.map(loaner=>{
    const items=schedules.filter(s=>String(s.loaner_id)===String(loaner.id));
    const status=items.length
      ? `<span class="inuse">使用 ${items.length}件</span>`
      : `<span class="available">空き</span>`;
    const body=items.length ? items.map(s=>{
      const member=findById(masters.members,s.member_id);
      const vehicle=findById(masters.vehicles,s.vehicle_id);
      return `<div class="mini-event">
        <div class="mini-time">${esc(timeText(s.start_time))}${s.end_time?' - '+esc(timeText(s.end_time)):''}</div>
        <div>${member?esc(labelOf(member)):''}${vehicle?' / '+esc(labelOf(vehicle)):''}${s.customer_name?' / '+esc(s.customer_name):''}</div>
      </div>`;
    }).join('') : '<div class="small">この日の予約はありません</div>';
    return `<div class="loaner-card">
      <div class="loaner-head">
        <div class="loaner-name">${esc(labelOf(loaner,'代車'))}</div>
        <div>${status}</div>
      </div>
      <div class="mini-list">${body}</div>
    </div>`;
  }).join('');
}


function renderScheduleSearch(){
  const box=$('searchResults');
  const q=$('scheduleSearch').value.trim().toLowerCase();
  if(!q){ box.classList.add('hidden'); box.innerHTML=''; return; }

  const results=monthSchedules.filter(s=>{
    const member=labelOf(findById(masters.members,s.member_id));
    const vehicle=labelOf(findById(masters.vehicles,s.vehicle_id));
    const et=labelOf(findById(masters.event_types,s.event_type_id));
    return [s.customer_name,member,vehicle,et,s.memo].filter(Boolean).join(' ').toLowerCase().includes(q);
  }).sort((a,b)=>(a.event_date+a.start_time).localeCompare(b.event_date+b.start_time));

  box.classList.remove('hidden');
  box.innerHTML=results.length ? results.map(s=>{
    const member=labelOf(findById(masters.members,s.member_id));
    const vehicle=labelOf(findById(masters.vehicles,s.vehicle_id));
    const et=labelOf(findById(masters.event_types,s.event_type_id),'予定');
    return `<div class="search-item" data-search-id="${esc(s.id)}">
      <b>${esc(s.event_date.replaceAll('-','/'))} ${isDayOffType(s.event_type_id)?'終日':esc(timeText(s.start_time))+' - '+esc(timeText(s.end_time))}</b>
      <div>${esc(member)} / ${esc(et)}${vehicle?' / '+esc(vehicle):''}${s.customer_name?' / '+esc(s.customer_name):''}</div>
    </div>`;
  }).join('') : '<div class="small">該当する予定はありません</div>';

  box.querySelectorAll('[data-search-id]').forEach(el=>el.addEventListener('click',()=>{
    const s=monthSchedules.find(x=>String(x.id)===String(el.dataset.searchId));
    if(s) openEdit(s.id);
  }));
}

function minutesFromOpen(v){
  if(!v) return 0;
  const [h,m]=timeText(v).split(':').map(Number);
  return (h*60+m) - 600;
}

function nextHalfHour(time){
  const [h,m]=time.split(':').map(Number);
  let total=h*60+m+30;
  if(total>1080) total=1080;
  return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
}

function openNewAt(memberId,start){
  openNew();
  $('memberId').value=memberId;
  $('startTime').value=start;
  $('endTime').value=nextHalfHour(start);
}

function renderTimelineView(){
  const schedules=selectedSchedules();
  $('timelineDateTitle').textContent=selectedDate.replaceAll('-','/')+' 1日のスケジュール';
  $('timelinePeopleBtn').classList.toggle('active',timelineMode==='people');
  $('timelineLoanerBtn').classList.toggle('active',timelineMode==='loaner');
  $('timelineVehicleBtn').classList.toggle('active',timelineMode==='vehicle');

  const resources=timelineMode==='people' ? masters.members : timelineMode==='loaner' ? masters.loaners : masters.vehicles;
  if(!resources.length){
    $('timelineTable').innerHTML=`<div class="empty">${timelineMode==='people'?'スタッフ':timelineMode==='loaner'?'代車':'車両'}が登録されていません</div>`;
    return;
  }

  const marks=[];
  for(let i=0;i<=16;i++){
    const total=600+i*30, h=Math.floor(total/60), m=total%60;
    const label=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    marks.push(`<span class="timeline-mark" style="left:${(i/16)*100}%">${label}</span>`);
  }

  let html=`<div class="timeline"><div class="timeline-head">
    <div class="timeline-staff-head">${timelineMode==='people'?'スタッフ':timelineMode==='loaner'?'代車':'車両'}</div>
    <div class="timeline-scale">${marks.join('')}</div></div>`;

  resources.forEach(resource=>{
    let items=schedules.filter(s=>timelineMode==='people'
      ? String(s.member_id)===String(resource.id)
      : timelineMode==='loaner' ? String(s.loaner_id)===String(resource.id)
      : String(s.vehicle_id)===String(resource.id))
      .sort((a,b)=>String(a.start_time||'00:00').localeCompare(String(b.start_time||'00:00')));

    const dayOffs=timelineMode==='people' ? items.filter(s=>isDayOffType(s.event_type_id)) : [];
    const normalItems=items.filter(isNormalSchedule);
    const status=dayOffs.length ? dayOffs.map(s=>labelOf(findById(masters.event_types,s.event_type_id),'休み')).join('・') : `${normalItems.length}件`;

    let track='';
    if(dayOffs.length){
      const s=dayOffs[0], et=findById(masters.event_types,s.event_type_id), c=colorOf(et);
      track=`<div class="timeline-dayoff" data-id="${esc(s.id)}" style="border-color:${esc(c)};background:${esc(c)}18;color:${esc(c)}">${esc(labelOf(et,'休み'))}（終日）</div>`;
    }else if(!normalItems.length){
      track='<div class="timeline-empty">予定なし</div>';
    }else{
      track=normalItems.map(s=>{
        const et=findById(masters.event_types,s.event_type_id);
        const vehicle=findById(masters.vehicles,s.vehicle_id);
        const member=findById(masters.members,s.member_id);
        const start=Math.max(0,Math.min(480,minutesFromOpen(s.start_time)));
        const endRaw=s.end_time?minutesFromOpen(s.end_time):start+30;
        const end=Math.max(start+30,Math.min(480,endRaw));
        const left=(start/480)*100, width=Math.max(6.25,((end-start)/480)*100), c=colorOf(et);
        return `<div class="timeline-event" data-id="${esc(s.id)}" style="left:${left}%;width:${width}%;border-color:${esc(c)};background:${esc(c)}18;color:#111827">
          <b>${esc(timeText(s.start_time))} - ${esc(timeText(s.end_time))}</b>
          <div>${esc(labelOf(et,'予定'))}${timelineMode==='loaner'&&member?' / '+esc(labelOf(member)):vehicle?' / '+esc(labelOf(vehicle)):''}</div>
          ${s.customer_name?`<div class="event-customer">${esc(s.customer_name)}</div>`:''}
          <span class="timeline-resize" title="時間の長さを変更"></span>
        </div>`;
      }).join('');
    }

    html+=`<div class="timeline-row"><div class="timeline-staff"><b>${esc(labelOf(resource,timelineMode==='people'?'スタッフ':timelineMode==='loaner'?'代車':'車両'))}</b><div class="small">${esc(status)}</div></div>
      <div class="timeline-track" data-resource-id="${esc(resource.id)}">${track}</div></div>`;
  });
  html+='</div>';
  $('timelineTable').innerHTML=html;

  const conflictOnTarget=(schedule,targetId,newStart,newEnd)=>{
    return schedules.some(s=>{
      if(String(s.id)===String(schedule.id) || isDayOffType(s.event_type_id)) return false;
      const same=timelineMode==='people' ? String(s.member_id)===String(targetId) : timelineMode==='loaner' ? String(s.loaner_id)===String(targetId) : String(s.vehicle_id)===String(targetId);
      if(!same) return false;
      return newStart < timeText(s.end_time||'23:59') && newEnd > timeText(s.start_time||'00:00');
    });
  };

  $('timelineTable').querySelectorAll('.timeline-event').forEach(el=>{
    let drag=null, suppressClick=false;
    el.addEventListener('pointerdown',e=>{
      if(e.button!==undefined&&e.button!==0) return;
      const schedule=monthSchedules.find(s=>String(s.id)===String(el.dataset.id));
      const track=el.closest('.timeline-track');
      if(!schedule||!track) return;
      const start=minutesFromOpen(schedule.start_time);
      const end=Math.max(start+30,minutesFromOpen(schedule.end_time));
      drag={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,startMinutes:start,duration:end-start,
        newStart:start,newDuration:end-start,newResourceId:String(track.dataset.resourceId),
        trackWidth:track.getBoundingClientRect().width,moved:false,resizing:!!e.target.closest('.timeline-resize')};
      el.setPointerCapture?.(e.pointerId); el.classList.add('dragging'); e.stopPropagation();
    });

    el.addEventListener('pointermove',e=>{
      if(!drag||e.pointerId!==drag.pointerId) return;
      const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
      if(Math.abs(dx)>5||Math.abs(dy)>5) drag.moved=true;
      if(!drag.moved) return;
      e.preventDefault();

      if(drag.resizing){
        let duration=Math.round((drag.duration+(dx/drag.trackWidth)*480)/30)*30;
        duration=Math.max(30,Math.min(480-drag.startMinutes,duration));
        drag.newDuration=duration;
        el.style.width=`${(duration/480)*100}%`;
      }else{
        let snapped=Math.round((drag.startMinutes+(dx/drag.trackWidth)*480)/30)*30;
        snapped=Math.max(0,Math.min(480-drag.duration,snapped));
        drag.newStart=snapped; el.style.left=`${(snapped/480)*100}%`;
        const hit=document.elementFromPoint(e.clientX,e.clientY), target=hit?hit.closest('.timeline-track'):null;
        if(target&&target.dataset.resourceId) drag.newResourceId=String(target.dataset.resourceId);
      }

      const fmt=t=>`${String(Math.floor((600+t)/60)).padStart(2,'0')}:${String((600+t)%60).padStart(2,'0')}`;
      const newEnd=drag.newStart+drag.newDuration;
      const b=el.querySelector('b'); if(b)b.textContent=`${fmt(drag.newStart)} - ${fmt(newEnd)}`;

      $('timelineTable').querySelectorAll('.timeline-track').forEach(t=>{t.style.outline='';t.classList.remove('conflict-target')});
      const target=[...$('timelineTable').querySelectorAll('.timeline-track')].find(t=>String(t.dataset.resourceId)===String(drag.newResourceId));
      if(target){
        const ns=fmt(drag.newStart), ne=fmt(newEnd);
        if(conflictOnTarget(monthSchedules.find(s=>String(s.id)===String(el.dataset.id)),drag.newResourceId,ns,ne)) target.classList.add('conflict-target');
        else {target.style.outline='2px solid #2563eb';target.style.outlineOffset='-2px'}
      }
    });

    const finish=async e=>{
      if(!drag||e.pointerId!==drag.pointerId)return;
      const d=drag; drag=null; el.classList.remove('dragging'); el.releasePointerCapture?.(e.pointerId);
      $('timelineTable').querySelectorAll('.timeline-track').forEach(t=>{t.style.outline='';t.classList.remove('conflict-target')});
      if(!d.moved)return;
      suppressClick=true;setTimeout(()=>suppressClick=false,350);

      const schedule=monthSchedules.find(s=>String(s.id)===String(el.dataset.id)); if(!schedule)return;
      const fmt=t=>`${String(Math.floor((600+t)/60)).padStart(2,'0')}:${String((600+t)%60).padStart(2,'0')}`;
      const newStart=fmt(d.newStart), newEnd=fmt(d.newStart+d.newDuration);
      const p={...schedule,start_time:newStart,end_time:newEnd};
      if(timelineMode==='people') p.member_id=d.newResourceId;
      else if(timelineMode==='loaner') p.loaner_id=d.newResourceId;
      else p.vehicle_id=d.newResourceId;

      const memberCheck=await hasMemberConflict(p,schedule.id);
      if(memberCheck?.error||memberCheck?.conflict){alert(memberCheck?.conflict?'その時間には担当者の別の予定があります。':'予定確認中にエラーが発生しました。');renderTimelineView();return}
      if(p.loaner_id){
        const loanerCheck=await hasLoanerConflict(p,schedule.id);
        if(loanerCheck?.error||loanerCheck?.conflict){alert(loanerCheck?.conflict?'その時間は選択中の代車が使用されています。':'代車確認中にエラーが発生しました。');renderTimelineView();return}
      }
      const update={start_time:newStart,end_time:newEnd};
      if(timelineMode==='people')update.member_id=d.newResourceId;
      else if(timelineMode==='loaner')update.loaner_id=d.newResourceId;
      else update.vehicle_id=d.newResourceId;
      const {error}=await sb.from('schedules').update(update).eq('id',schedule.id);
      if(error){alert('変更を保存できませんでした：'+error.message);renderTimelineView();return}
      await loadMonth();
    };
    el.addEventListener('pointerup',finish);
    el.addEventListener('pointercancel',()=>renderTimelineView());
    el.addEventListener('click',e=>{e.stopPropagation();if(!suppressClick)openEdit(el.dataset.id)});
  });

  $('timelineTable').querySelectorAll('.timeline-dayoff').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();openEdit(el.dataset.id)}));

  $('timelineTable').querySelectorAll('.timeline-track').forEach(track=>track.addEventListener('click',e=>{
    if(e.target.closest('[data-id]'))return;
    const rect=track.getBoundingClientRect(), x=Math.max(0,Math.min(rect.width,e.clientX-rect.left));
    const slot=Math.min(450,Math.floor(((x/rect.width)*480)/30)*30), total=600+slot;
    const start=`${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
    if(timelineMode==='people') openNewAt(track.dataset.resourceId,start);
    else {openNew(); if(timelineMode==='loaner')$('loanerId').value=track.dataset.resourceId;else $('vehicleId').value=track.dataset.resourceId;$('startTime').value=start;$('endTime').value=nextHalfHour(start)}
  }));
}

function updateAvailability(){
  const box=$('availabilityInfo'); if(!box)return;
  if(isDayOffType($('eventTypeId').value)){box.textContent='';return}
  const member=$('memberId').value, loaner=$('loanerId').value, date=$('eventDate').value;
  if(!date){box.textContent='';return}
  const items=monthSchedules.filter(s=>s.event_date===date && isNormalSchedule(s));
  const free=[];
  for(let total=600;total<1080;total+=30){
    const st=`${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
    const en=`${String(Math.floor((total+30)/60)).padStart(2,'0')}:${String((total+30)%60).padStart(2,'0')}`;
    const busy=items.some(s=>(member&&String(s.member_id)===String(member)||loaner&&String(s.loaner_id)===String(loaner)) && st<timeText(s.end_time||'23:59')&&en>timeText(s.start_time));
    if(!busy)free.push(st);
  }
  box.textContent=(member||loaner)?`空き30分枠：${free.join('、')||'なし'}`:'';
}

async function hasLoanerConflict(p,id){
  if(!p.loaner_id || !p.event_date || !p.start_time) return null;

  let q=sb.from('schedules')
    .select('id,event_date,start_time,end_time,loaner_id')
    .eq('event_date',p.event_date)
    .eq('loaner_id',p.loaner_id);

  const {data,error}=await q;
  if(error) return {error};

  const newStart=p.start_time;
  const newEnd=p.end_time || '23:59';

  const conflict=(data||[]).find(s=>{
    if(id && String(s.id)===String(id)) return false;
    const oldStart=s.start_time || '00:00';
    const oldEnd=s.end_time || '23:59';
    return newStart < oldEnd && newEnd > oldStart;
  });

  return {conflict};
}

async function hasVehicleConflict(p,id){
  if(!p.vehicle_id || !p.event_date || !p.start_time) return null;
  const {data,error}=await sb.from('schedules').select('id,start_time,end_time,vehicle_id,event_type_id')
    .eq('event_date',p.event_date).eq('vehicle_id',p.vehicle_id);
  if(error)return {error};
  const et=labelOf(findById(masters.event_types,p.event_type_id));
  if(!et.includes('試乗')) return {conflict:null};
  const conflict=(data||[]).find(s=>{
    if(id&&String(s.id)===String(id))return false;
    const otherType=labelOf(findById(masters.event_types,s.event_type_id));
    return otherType.includes('試乗') && p.start_time<(s.end_time||'23:59') && (p.end_time||'23:59')>(s.start_time||'00:00');
  });
  return {conflict};
}

async function hasMemberConflict(p,id){
  if(!p.member_id || !p.event_date || !p.start_time) return null;

  let q=sb.from('schedules')
    .select('id,event_date,start_time,end_time,member_id,event_type_id,customer_name')
    .eq('event_date',p.event_date)
    .eq('member_id',p.member_id);

  const {data,error}=await q;
  if(error) return {error};

  const newStart=p.start_time;
  const newEnd=p.end_time || '23:59';

  const conflict=(data||[]).find(s=>{
    if(id && String(s.id)===String(id)) return false;
    const oldStart=s.start_time || '00:00';
    const oldEnd=s.end_time || '23:59';
    return newStart < oldEnd && newEnd > oldStart;
  });

  return {conflict};
}

async function saveSchedule(ev){
  if(ev) ev.preventDefault();

  $('formStatus').className='status';
  $('formStatus').textContent='';

  const id=$('scheduleId').value;
  const p=payload();
  const dayOff=isDayOffType(p.event_type_id);
  if(p.customer_id){
    const c=findById(masters.customers,p.customer_id);
    if(c){p.customer_name=c.name||p.customer_name;p.customer_phone=c.phone||p.customer_phone;}
  }

  if(!p.event_date){
    $('formStatus').className='status error';
    $('formStatus').textContent='日付を選択してください。';
    return;
  }
  if(!p.member_id){
    $('formStatus').className='status error';
    $('formStatus').textContent='担当者を選択してください。';
    return;
  }
  if(!p.event_type_id){
    $('formStatus').className='status error';
    $('formStatus').textContent='予定種類を選択してください。';
    return;
  }
  if(!dayOff && !p.start_time){
    $('formStatus').className='status error';
    $('formStatus').textContent='開始時間を入力してください。';
    return;
  }

  $('saveBtn').disabled=true;
  $('formStatus').textContent='確認中…';

  if(p.vehicle_id && !dayOff){
    const check=await hasVehicleConflict(p,id);
    if(check?.error){$('saveBtn').disabled=false;$('formStatus').className='status error';$('formStatus').textContent='車両確認エラー：'+check.error.message;return}
    if(check?.conflict){$('saveBtn').disabled=false;$('formStatus').className='status error';$('formStatus').textContent='この時間は同じ車両に別の試乗予定があります。';return}
  }

  if(p.loaner_id){
    const check=await hasLoanerConflict(p,id);
    if(check?.error){
      $('saveBtn').disabled=false;
      $('formStatus').className='status error';
      $('formStatus').textContent='代車確認エラー：'+check.error.message;
      return;
    }
    if(check?.conflict){
      const loaner=findById(masters.loaners,p.loaner_id);
      $('saveBtn').disabled=false;
      $('formStatus').className='status error';
      $('formStatus').textContent=
        `この時間は${labelOf(loaner,'この代車')}が使用中です（${timeText(check.conflict.start_time)} - ${timeText(check.conflict.end_time)}）`;
      return;
    }
  }

  if(p.member_id){
    const check=await hasMemberConflict(p,id);
    if(check?.error){
      $('saveBtn').disabled=false;
      $('formStatus').className='status error';
      $('formStatus').textContent='担当者確認エラー：'+check.error.message;
      return;
    }
    if(check?.conflict){
      const member=findById(masters.members,p.member_id);
      const eventType=findById(masters.event_types,check.conflict.event_type_id);
      const conflictName=labelOf(eventType,'予定');
      const newIsDayOff=isDayOffType(p.event_type_id);
      const conflictIsDayOff=isDayOffType(check.conflict.event_type_id);

      $('saveBtn').disabled=false;
      $('formStatus').className='status error';

      if(conflictIsDayOff && !newIsDayOff){
        $('formStatus').textContent=
          `${labelOf(member,'このスタッフ')}はこの日「${conflictName}」です。`;
      }else if(newIsDayOff && !conflictIsDayOff){
        $('formStatus').textContent=
          `${labelOf(member,'このスタッフ')}にはこの日の予定がすでに入っています。先に予定を確認してください。`;
      }else{
        const detail=conflictName + (check.conflict.customer_name ? ` / ${check.conflict.customer_name}` : '');
        $('formStatus').textContent=
          `${labelOf(member,'このスタッフ')}はこの時間に別の予定があります（${timeText(check.conflict.start_time)} - ${timeText(check.conflict.end_time)} / ${detail}）`;
      }
      return;
    }
  }

  $('formStatus').textContent='保存中…';

  let res;
  if(id){
    res=await sb.from('schedules').update(p).eq('id',id);
  }else if($('repeatType').value!=='none'){
    const count=Number($('repeatCount').value||2), rows=[];
    for(let i=0;i<count;i++){
      const row={...p}, d=new Date(p.event_date+'T00:00:00');
      if($('repeatType').value==='weekly') d.setDate(d.getDate()+i*7);
      else d.setMonth(d.getMonth()+i);
      row.event_date=localDateISO(d); rows.push(row);
    }
    res=await sb.from('schedules').insert(rows);
  }else{
    res=await sb.from('schedules').insert(p);
  }

  $('saveBtn').disabled=false;

  if(res.error){
    $('formStatus').className='status error';
    $('formStatus').textContent='保存エラー：'+res.error.message;
    return;
  }

  selectedDate=p.event_date;
  const d=new Date(selectedDate+'T00:00:00');
  visibleMonth=new Date(d.getFullYear(),d.getMonth(),1);
  dialog.close();
  await loadMonth();
}
async function deleteSchedule(){
  const id=$('scheduleId').value; if(!id || !confirm('この予定を削除しますか？'))return;
  $('deleteBtn').disabled=true;
  const {error}=await sb.from('schedules').delete().eq('id',id);
  $('deleteBtn').disabled=false;
  if(error){ $('formStatus').textContent='削除エラー：'+error.message; $('formStatus').className='status error'; return; }
  dialog.close();
  await loadMonth();
}
