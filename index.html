<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗スケジュール</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 32px 20px;
      background: #f6f7f9;
      color: #111;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    h1 { margin-top: 0; font-size: 28px; }
    p { font-size: 18px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>店舗スケジュール</h1>
    <p>接続テスト成功</p>
  </div>
</body>
</html>
